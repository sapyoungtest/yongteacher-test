<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>용선생 독해력 진단 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2622; --sub:#6f675f; --line:#e4ddd3; --paper:#fffdf9;
    --ok:#2f6b4f; --ok-soft:#e5f1ea; --ng:#a03a2c; --ng-soft:#f7e5e1;
    --accent:#3d3a36; --accent-soft:#ece8e2; --bg:#f6f3ee;
  }
  body.t0{--accent:#5b3f8c; --accent-soft:#ece6f5; --bg:#f3f0f7;}
  body.t1{--accent:#245a6b; --accent-soft:#e1eef1; --bg:#eef4f4;}
  body.t2{--accent:#7a2e3a; --accent-soft:#f3e6e8; --bg:#f7f1ef;}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;}
  body{min-height:100vh;background:var(--bg);transition:background .35s}
  .hidden{display:none !important}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px}
  .btn{font:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:12px 22px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff;text-decoration:none;display:inline-block;text-align:center}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.big{font-size:16px;padding:14px 30px}
  .eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}

  /* 시작·전환 화면 */
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
  .start{max-width:620px;width:100%;padding:40px 40px 36px}
  .start h1{font-family:"Noto Serif KR",serif;font-size:28px;margin:6px 0 18px;line-height:1.35}
  .summary{display:flex;gap:10px;margin:0 0 22px}
  .summary div{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;background:#fff}
  .summary b{display:block;font-family:"Noto Serif KR",serif;font-size:26px;line-height:1.15}
  .summary span{font-size:13px;color:var(--sub)}
  .gradepick{margin:0 0 20px}
  .gq{font-size:16px;font-weight:700;margin-bottom:10px}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .gbtn{font:inherit;font-size:15.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;cursor:pointer;color:var(--ink)}
  .gbtn:hover{border-color:#cdbfb0}
  .gbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
  .rules{font-size:14px;color:var(--sub);line-height:1.8;margin:0 0 26px;padding-left:18px}
  .intro{max-width:520px;width:100%;padding:52px 40px;text-align:center;border-top:8px solid var(--accent)}
  .intro .step{font-size:14px;color:var(--sub);font-weight:500}
  .intro h2{font-family:"Noto Serif KR",serif;font-size:32px;line-height:1.35;color:var(--accent);margin:8px 0 6px}
  .intro .range{display:inline-block;font-weight:700;font-size:15px;color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:999px;margin-bottom:14px}
  .intro p{font-size:15.5px;color:#433c36;line-height:1.8;margin:0 0 28px;word-break:keep-all}

  /* 상단 진행 표시 */
  .topbar{max-width:780px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .topbar .t{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700}
  .groups{margin-left:auto;display:flex;gap:14px}
  .grp{display:flex;flex-direction:column;gap:5px}
  .grp .gl{font-size:12px;font-weight:700;color:var(--sub)}
  .grp.on .gl{color:var(--accent)}
  .dots{display:flex;gap:4px}
  .dot{width:18px;height:6px;border-radius:3px;background:var(--line)}
  .dot.done{background:#bfb6ad}
  .grp.on .dot.done{background:color-mix(in srgb,var(--accent) 45%,white)}
  .dot.now{background:var(--accent)}
  .stage{max-width:780px;margin:0 auto;padding:16px 20px 40px}

  /* 지문 화면 */
  .passage{padding:0 0 26px;border-top:6px solid var(--accent)}
  .phead{padding:20px 30px 14px;border-bottom:1px solid var(--line);margin-bottom:18px;font-weight:700;font-size:16px;color:var(--accent)}
  .passage p{font-family:"Noto Serif KR",serif;font-size:16.5px;line-height:1.95;margin:0 30px 14px;text-indent:1em;word-break:keep-all}
  .pnav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

  /* 문제 화면 */
  .qpane{padding:26px 28px}
  .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin-bottom:10px}
  .qhead{display:flex;align-items:flex-start;gap:10px}
  .qhead .tag{margin-right:auto}
  .reread{font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:#fff;border:1.5px solid var(--accent);border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
  .qtext{font-size:18px;line-height:1.6;font-weight:700;margin:0 0 16px;word-break:keep-all}
  .qtext .num{color:var(--accent);margin-right:6px}
  .qbox{border:1.5px solid #cfc6bb;border-radius:12px;background:#fff;padding:16px 18px;margin:0 0 16px;font-size:15.5px;line-height:1.85;word-break:keep-all}
  .qbox u{text-underline-offset:4px;text-decoration-thickness:1.5px}
  .qbox ul{margin:0;padding-left:18px}
  .blank{display:inline-block;width:64px;height:22px;border:1.5px solid #9d948a;vertical-align:middle;margin:0 3px;border-radius:2px;background:#fff}
  .choices{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .choices.inline{flex-direction:row}
  .choices.inline li{flex:1}
  .choices.inline .choice{justify-content:center;font-size:18px}
  .choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 15px;font:inherit;font-size:15.5px;line-height:1.55;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s;word-break:keep-all}
  .choice:hover{border-color:#cdbfb0}
  .choice .mark{flex:0 0 auto;font-weight:700;color:var(--sub);min-width:18px}
  .choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .choice[aria-checked="true"] .mark{color:var(--accent)}
  .choice u{text-underline-offset:4px}
  .hint{font-size:13px;color:var(--sub);margin-top:10px;min-height:18px}
  .nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}

  /* 글 다시 보기 창 */
  .overlay{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal{max-width:680px;width:100%;max-height:calc(100vh - 40px);overflow:auto;position:relative}
  .modal .close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px 14px 0;background:var(--paper);z-index:1}
  .modal .close button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}

  /* 진단 결과 */
  .reco{max-width:520px;width:100%;padding:36px 36px 32px;background:#fff}
  .dhead{font-size:17px;font-weight:700}
  .dhead span{color:#3f73b5}
  .dsub{font-size:13px;color:var(--sub);margin-top:4px}
  .dlead{font-size:21px;font-weight:700;line-height:1.5;margin:18px 0 22px;word-break:keep-all}
  .dsec{font-size:14.5px;font-weight:700;color:#433c36;margin-bottom:12px}
  .darea{margin-bottom:18px}
  .dt{font-size:15.5px;font-weight:700;margin-bottom:8px}
  .dt small{font-weight:500;color:var(--sub);font-size:14px;margin-left:4px}
  .seg{display:flex;gap:5px;height:12px;margin:2px 0 9px}
  .seg i{flex:1;border-radius:999px;background:#e9edf3;box-shadow:inset 0 1px 2px rgba(30,50,80,.08)}
  .seg i.on{background:#4b84d4;box-shadow:0 2px 6px rgba(63,115,196,.25)}
  .dc{font-size:14.5px;line-height:1.7;color:#433c36;margin:0;word-break:keep-all}
  .cover-img{display:block;width:220px;height:auto;margin:22px auto 10px}
  .dclose{text-align:center;font-size:16px;line-height:1.7;margin:0 0 24px;word-break:keep-all}
  .tips{background:#f4f7fc;border-radius:12px;padding:18px 20px;margin:24px 0 20px}
  .tips h4{margin:0 0 10px;font-size:15.5px;color:#2f5f9e}
  .tips .tip{font-size:14.5px;line-height:1.75;color:#433c36;margin:0 0 10px;word-break:keep-all}
  .tips .tip:last-child{margin-bottom:0}
  .tips .tip b{color:var(--ink)}
  .rbtns{display:flex;flex-direction:column;gap:10px;align-items:center}
  .rbtns .btn{min-width:240px}
  .backreco{display:block;margin:10px auto 0;background:none;border:0;font:inherit;font-size:14px;color:var(--sub);text-decoration:underline;cursor:pointer}

  /* 자세한 결과 */
  .result{max-width:820px;margin:0 auto;padding:28px 20px 50px}
  .rcard{padding:34px 36px;text-align:center}
  .score{font-family:"Noto Serif KR",serif;font-size:56px;font-weight:700;line-height:1;margin-top:14px}
  .score small{font-size:22px;color:var(--sub)}
  .areas{max-width:460px;margin:18px auto 10px}
  .areas svg{width:100%;height:auto;display:block;font-family:"Noto Sans KR",sans-serif}
  .bysets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .area{border:1px solid var(--line);border-radius:10px;padding:12px 8px;background:#fff}
  .area b{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
  .area span{font-size:18px;font-weight:700}
  .review{margin-top:18px;padding:26px 30px}
  .review h3{font-size:16px;margin:0 0 6px}
  .rset{font-size:14px;font-weight:700;margin:18px 0 6px;padding-left:10px;border-left:4px solid}
  .rset.s0{color:#5b3f8c;border-color:#5b3f8c} .rset.s1{color:#245a6b;border-color:#245a6b} .rset.s2{color:#7a2e3a;border-color:#7a2e3a}
  .ritem{border-top:1px solid var(--line);padding:12px 0}
  .ritem .rq{font-size:15px;font-weight:700;line-height:1.55;margin-bottom:6px;word-break:keep-all}
  .ritem .ra{font-size:14.5px;line-height:1.6;color:#433c36;word-break:keep-all}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-right:6px}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.ng{background:var(--ng-soft);color:var(--ng)}
  .ractions{display:flex;justify-content:center;gap:10px;margin-top:22px}

  /* B안: 글과 문제를 함께 보기 */
  body.layoutB .topbar{max-width:1180px}
  body.layoutB .stage{max-width:1180px;display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:start}
  body.layoutB .stage.solo{grid-template-columns:minmax(0,780px);justify-content:center}
  body.layoutB .stage .passage{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
  .passage .sbox{font-family:"Noto Serif KR",serif;font-size:16.5px;line-height:1.95;margin:0 30px;word-break:keep-all}
  .passage .sbox u{text-underline-offset:5px;text-decoration-thickness:1.5px}
  @media (max-width:860px){
    body.layoutB .stage{grid-template-columns:1fr;gap:12px}
    body.layoutB .stage .passage{position:sticky;top:0;z-index:5;max-height:42vh;box-shadow:0 6px 14px rgba(0,0,0,.08)}
    body.layoutB .stage .passage p{font-size:15px;line-height:1.8}
    body.layoutB .passage .sbox{margin:0 20px;font-size:15px;line-height:1.8}
  }

  @media (max-width:640px){
    .topbar{padding:16px 16px 0}
    .groups{margin-left:0}
    .stage{padding:12px 14px 32px}
    .phead{padding:18px 20px 12px}
    .passage p{margin:0 20px 14px}
    .qpane{padding:22px 18px}
    .start,.intro,.reco{padding:32px 22px}
    .rcard{padding:28px 18px}
    .review{padding:22px 18px}
    .bysets{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- 시작 화면 -->
<main id="startScreen" class="center">
  <section class="card start">
    <div class="eyebrow" style="color:var(--sub)">독해력 진단</div>
    <h1>용선생 독해력 진단 평가</h1>
    <div class="summary">
      <div><b id="sumQ"></b><span>문항</span></div>
    </div>
    <div class="gradepick">
      <div class="gq">현재 몇 학년인가요?</div>
      <div class="grades" id="grades">
        <button type="button" class="gbtn" data-g="3">3학년</button>
        <button type="button" class="gbtn" data-g="4">4학년</button>
        <button type="button" class="gbtn" data-g="5">5학년</button>
        <button type="button" class="gbtn" data-g="6">6학년</button>
      </div>
    </div>
    <ul class="rules">
      <li>어휘 → 짧은 글 읽기 → 비문학 독해 순서로 한 문항씩 풀어요.</li>
      <li>정답 여부는 문제를 푸는 동안 알려 주지 않아요.</li>
      <li>모든 문항을 풀면 영역별 독해력 진단 결과를 확인할 수 있어요.</li>
    </ul>
    <div style="text-align:center"><button class="btn big" id="startBtn" type="button" disabled>진단 시작하기</button></div>
  </section>
</main>

<!-- 단계 전환 화면 -->
<main id="introScreen" class="center hidden">
  <section class="card intro">
    <div class="step" id="introStep"></div>
    <h2 id="introTitle"></h2>
    <div class="range" id="introRange"></div>
    <p id="introText"></p>
    <button class="btn big" id="introBtn" type="button">시작하기</button>
  </section>
</main>

<!-- 문제·지문 화면 -->
<div id="quizScreen" class="hidden">
  <div class="topbar">
    <div class="t">용선생 독해력 진단 평가</div>
    <div class="groups" id="groups"></div>
  </div>
  <main class="stage" id="stage">
    <section class="card passage hidden" id="passageView"></section>
    <div class="pnav hidden" id="passageNav">
      <button class="btn ghost" id="pPrev" type="button">이전</button>
      <button class="btn" id="pNext" type="button">문제 풀기</button>
    </div>
    <section class="card qpane hidden" id="questionView" aria-live="polite">
      <div class="qhead"><span class="tag" id="tag"></span><button class="reread hidden" id="reread" type="button">글 다시 보기</button></div>
      <p class="qtext" id="qtext"></p>
      <div id="qbox"></div>
      <ul class="choices" id="choices" role="radiogroup"></ul>
      <div class="hint" id="hint"></div>
      <div class="nav">
        <button class="btn ghost" id="prev" type="button">이전</button>
        <button class="btn" id="next" type="button">다음</button>
      </div>
    </section>
  </main>
</div>

<div class="overlay hidden" id="overlay">
  <section class="card passage modal" id="modal"></section>
</div>

<!-- 진단 결과 화면 -->
<main id="recoScreen" class="center hidden">
  <section class="card reco">
    <div class="dhead">[독해력 진단 결과] <span id="dBand"></span></div>
    <div class="dsub" id="dGrade"></div>
    <p class="dlead" id="dLead"></p>
    <div class="dsec">[영역별 결과]</div>
    <div id="dAreas"></div>
    <img class="cover-img" id="recoCover" alt="">
    <p class="dclose" id="dClose"></p>
    <div class="tips hidden" id="dTips"></div>
    <div class="rbtns">
      <a class="btn big hidden" id="buyBtn" target="_blank" rel="noopener">교재 자세히 보기</a>
      <button class="btn ghost big" id="toResult" type="button">문항별 결과 보기</button>
    </div>
  </section>
</main>

<!-- 자세한 결과 화면 -->
<main id="resultScreen" class="result hidden">
  <section class="card rcard">
    <div class="eyebrow" style="color:var(--sub)">용선생 독해력 진단 평가 결과 · <span id="resGrade"></span></div>
    <div class="score" id="score"></div>
    <div class="areas" id="areas"></div>
    <div class="bysets" id="bysets"></div>
  </section>
  <section class="card review hidden" id="review">
    <h3>정답 확인</h3>
    <div id="reviewList"></div>
  </section>
  <div class="ractions">
    <button class="btn ghost" id="showReview" type="button">정답 확인하기</button>
    <button class="btn" id="retry" type="button">처음부터 다시 풀기</button>
  </div>
  <button class="backreco" id="backReco" type="button">진단 결과 다시 보기</button>
</main>

<template id="pFrida">
  <p>프리다 칼로는 인생에서 겪은 고통을 그림에 담아낸 화가입니다. 그는 여섯 살 때 소아마비에 걸려 오른쪽 다리가 왼쪽에 비해 짧고 가늘었습니다. 게다가 18살이 되던 해에는 교통사고를 당해 척추와 골반이 골절되었습니다. 크게 다친 칼로는 석 달 동안 침대에 누워 지내야 했습니다.</p>
  <p>방에 고립되었던 동안 칼로는 고통을 잊기 위해 그림을 그리기 시작했습니다. 이후 교통사고의 후유증으로 수십 차례의 수술과 여러 번의 유산을 겪은 칼로는 가시 목걸이나 죽은 태아와 같은 상징이 포함된 자화상으로 자신이 경험한 아픔을 드러냈습니다.</p>
  <p>칼로는 그림에 자신의 신체적인 고통뿐만 아니라 여성으로서의 경험도 표현하였습니다. 그는 유산뿐만 아니라 낙태, 출산, 모유 수유 등 당시에는 터부시되던 여성의 삶의 모습을 그림에 직접 드러냈습니다. 그래서 칼로는 오늘날 예술로 페미니즘을 실천한 화가로 기억되고 있습니다.</p>
</template>
<template id="pNut">
  <p>『호두까기 인형』은 고전 3대 발레 걸작 중 하나로, 크리스마스 선물로 호두까기 인형을 받은 소녀의 이야기를 담고 있습니다. 매년 12월 전 세계의 무대에 오르는 이 작품은 크리스마스를 대표하는 공연으로 자리 잡았습니다. 이토록 사랑 받는 『호두까기 인형』은 2010년대부터 인종차별적이라는 비판을 본격적으로 받기 시작했습니다. 기존 공연에 등장하는 중국인은 얼굴을 노랗게 분장하고 머리에 젓가락을 꽂은 채 과장된 춤을 춥니다. 아라비아를 대표하는 인물 역시 배가 드러나는 의상을 입고 발목에 방울을 착용합니다. 비평가들은 이러한 표현들이 특정 인종에 대한 고정 관념을 강화한다고 지적하였습니다.</p>

};
const LAYOUT = "A";
const STAGE_COLOR = { 3: "#e255d8", 4: "#8f75e8", 5: "#1f93f0", 6: "#10b3b3" };
const NUMS = ["①","②","③","④","⑤"];
const CIRCLED = ["①","②","③","④","⑤","⑥"];
const $ = id => document.getElementById(id);

/* ===== 문항 펼치기·진행 단계 만들기 ===== */
const QUESTIONS = [];
const RANGES = [];
SECTIONS.forEach((s, si) => {
  const a = QUESTIONS.length + 1;
  s.questions.forEach(q => QUESTIONS.push({ ...q, sec: si }));
  RANGES.push([a, QUESTIONS.length]);
});
function rangeOf(q){
  const qs = QUESTIONS.map((x, k) => (q.passage ? x.passage === q.passage : x === q) ? k + 1 : 0).filter(Boolean);
  return [qs[0], qs[qs.length - 1]];
}
const STEPS = [];
SECTIONS.forEach((s, si) => {
  STEPS.push({ type: "intro", sec: si });
  let lastP = null;
  QUESTIONS.forEach((q, i) => {
    if (q.sec !== si) return;
    if (LAYOUT === "A" && q.passage && q.passage !== lastP) {
      STEPS.push({ type: "passage", sec: si, passage: q.passage, range: rangeOf(q) });
      lastP = q.passage;
    }
    STEPS.push({ type: "q", sec: si, i });
  });
});

let step = 0, picks = [], grade = null;
const resetPicks = () => { picks = QUESTIONS.map(() => null); };
resetPicks();

function show(screen){
  ["startScreen","introScreen","quizScreen","recoScreen","resultScreen"].forEach(id => $(id).classList.toggle("hidden", id !== screen));
  window.scrollTo({ top: 0 });
}
function theme(t){ document.body.className = (t === null ? "" : "t" + t) + " layout" + LAYOUT; }
function passageHTML(pid, range){
  return `<div class="phead">[${range[0]}~${range[1]}] ${PASSAGES[pid].head}</div>` + document.getElementById(pid).innerHTML;
}

/* 시작 화면 */
$("sumQ").textContent = QUESTIONS.length;
$("grades").addEventListener("click", e => {
  const b = e.target.closest("[data-g]");
  if (!b) return;
  grade = Number(b.dataset.g);
  document.querySelectorAll(".gbtn").forEach(x => x.setAttribute("aria-pressed", x === b));
  $("startBtn").disabled = false;
});
$("startBtn").addEventListener("click", () => { if (grade) go(0); });

/* B안: 문제 옆(모바일은 위)에 글을 계속 보여 줌 */
let shownSide = null;
function renderSide(i){
  const q = QUESTIONS[i], box = $("passageView");
  const key = q.passage || (q.side ? "q" + i : null);
  $("stage").classList.toggle("solo", !key);
  box.classList.toggle("hidden", !key);
  if (!key) { shownSide = null; return; }
  if (key === shownSide) return;
  shownSide = key;
  const [a, b] = rangeOf(q);
  box.innerHTML = `<div class="phead">[${a === b ? a : `${a}~${b}`}] 다음 글을 읽고, 물음에 답하세요.</div>`
    + (q.passage ? document.getElementById(q.passage).innerHTML : `<div class="sbox">${q.box}</div>`);
  box.scrollTop = 0;
}

/* 단계 이동 */
function go(n){
  step = n;
  const st = STEPS[n];
  theme(st.sec);
  if (st.type === "intro") {
    const s = SECTIONS[st.sec], [a, b] = RANGES[st.sec];
    $("introStep").textContent = `${SECTIONS.length}단계 중 ${st.sec + 1}단계`;
    $("introTitle").textContent = s.stage;
    $("introRange").textContent = `[${a}~${b}번]`;
    $("introText").textContent = (LAYOUT === "B" && s.textB) ? s.textB : s.text;
    return show("introScreen");
  }
  show("quizScreen");
  renderGroups(st);
  if (LAYOUT === "B") {
    $("passageNav").classList.add("hidden");
    $("questionView").classList.remove("hidden");
    renderSide(st.i);
    return renderQuestion(st.i);
  }
  const isP = st.type === "passage";
  $("passageView").classList.toggle("hidden", !isP);
  $("passageNav").classList.toggle("hidden", !isP);
  $("questionView").classList.toggle("hidden", isP);
  if (isP) { $("passageView").innerHTML = passageHTML(st.passage, st.range); return; }
  renderQuestion(st.i);
}
function prevStep(){
  let n = step - 1;
  while (n >= 0 && STEPS[n].type === "intro") n--;
  if (n >= 0) go(n);
}
function nextStep(){
  if (step === STEPS.length - 1) return showDiagnosis();
  go(step + 1);
}
$("introBtn").addEventListener("click", nextStep);
$("pNext").addEventListener("click", nextStep);
$("pPrev").addEventListener("click", prevStep);
$("prev").addEventListener("click", prevStep);
$("next").addEventListener("click", () => { if (picks[STEPS[step].i] !== null) nextStep(); });

function renderGroups(st){
  const cur = st.type === "q" ? st.i : -1;
  $("groups").innerHTML = SECTIONS.map((s, si) => {
    const [a, b] = RANGES[si];
    let d = "";
    for (let i = a - 1; i < b; i++) d += `<span class="dot ${i === cur ? "now" : (picks[i] !== null ? "done" : "")}"></span>`;
    return `<div class="grp ${si === st.sec ? "on" : ""}"><span class="gl">${s.short} [${a}~${b}번]</span><div class="dots">${d}</div></div>`;
  }).join("");
}
function renderQuestion(i){
  const q = QUESTIONS[i];
  $("tag").textContent = q.tag;
  $("reread").classList.toggle("hidden", !(LAYOUT === "A" && q.passage));
  $("qtext").innerHTML = `<span class="num">${String(i + 1).padStart(2, "0")}</span>${q.q}`;
  $("qbox").innerHTML = q.box && !(LAYOUT === "B" && q.side) ? `<div class="qbox">${q.box}</div>` : "";
  $("choices").className = "choices" + (q.inline ? " inline" : "");
  $("choices").innerHTML = q.choices.map((c, k) =>
    `<li><button type="button" class="choice" role="radio" aria-checked="${picks[i] === k}" data-k="${k}">
       <span class="mark">${NUMS[k]}</span>${c ? `<span>${c}</span>` : ""}</button></li>`).join("");
  const last = step === STEPS.length - 1;
  const nx = STEPS[step + 1];
  let label = "다음";
  if (last) label = "결과 보기";
  else if (nx.type === "intro") label = "다음 단계로";
  else if (nx.type === "passage") label = "다음 글로";
  else if (LAYOUT === "B" && QUESTIONS[nx.i].passage && QUESTIONS[nx.i].passage !== q.passage) label = "다음 글로";
  $("next").textContent = label;
  $("next").disabled = picks[i] === null;
  $("prev").disabled = step <= 1;
  $("hint").textContent = picks[i] === null ? "답을 하나 고르면 다음으로 넘어갈 수 있어요." : "";
}
$("choices").addEventListener("click", e => {
  const b = e.target.closest(".choice");
  if (!b) return;
  const i = STEPS[step].i;
  picks[i] = Number(b.dataset.k);
  renderQuestion(i); renderGroups(STEPS[step]);
});

/* A안: 글 다시 보기 */
$("reread").addEventListener("click", () => {
  const q = QUESTIONS[STEPS[step].i];
  $("modal").innerHTML = `<div class="close"><button type="button" id="closeModal">문제로 돌아가기</button></div>` + passageHTML(q.passage, rangeOf(q));
  $("overlay").classList.remove("hidden");
});
$("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay" || e.target.id === "closeModal") $("overlay").classList.add("hidden");
});

/* ===== 진단 결과 ===== */
function areaStats(correct){
  return AREAS.map(a => {
    const idx = QUESTIONS.map((q, i) => q.area === a.key ? i : -1).filter(i => i >= 0);
    const got = idx.filter(i => correct[i]).length;
    const r = idx.length ? got / idx.length : 0;
    const lv = r === 1 ? 0 : (r >= 0.5 ? 1 : 2);   /* 0 평균 이상 / 1 무난 / 2 연습 필요 */
    return { ...a, n: idx.length, got, lv };
  });
}
function showDiagnosis(){
  const correct = QUESTIONS.map((q, i) => picks[i] === q.answer);
  const N = QUESTIONS.length;
  const score = correct.filter(Boolean).length, wrong = N - score;
  const stats = areaStats(correct);

  $("dGrade").textContent = `${grade}학년 · 총 ${N}문항 중 ${score}개 정답`;
  $("dAreas").innerHTML = stats.map((s, k) => `<div class="darea"><div class="dt">${CIRCLED[k]} ${s.label}<small>(${s.got}개/총 ${s.n}개)</small></div>
      <div class="seg">${Array.from({ length: s.n }, (_, j) => `<i class="${j < s.got ? "on" : ""}"></i>`).join("")}</div>
      <p class="dc">${s.msg[s.lv]}</p></div>`).join("");

  let stage = null;
  if (wrong <= 2) {
    stage = grade;
    $("dBand").textContent = `上_ 정답 ${N - 2}개 이상`;
    $("dLead").textContent = "최상위권 수준의 독해력을 가졌습니다.";
    $("dClose").innerHTML = `<b style="color:${STAGE_COLOR[stage]}">〈용선생 최상위 독해〉 ${stage}단계</b>로 최상위권 실력을 흔들림 없이 지키세요.`;
  } else if (wrong <= 5) {
    stage = Math.max(MIN_STAGE, grade - 1);
    $("dBand").textContent = `中_ 정답 ${N - 5}~${N - 3}개`;
    $("dLead").textContent = `${grade}학년 평균 수준의 독해력을 가졌습니다.`;
    $("dClose").innerHTML = `<b style="color:${STAGE_COLOR[stage]}">〈용선생 최상위 독해〉 ${stage}단계</b>로 실력을 탄탄하게 키우세요.`;
  } else {
    $("dBand").textContent = `정답 ${N - 6}개 이하`;
    const weak = stats.filter(s => s.lv === 2);
    if (weak.length <= 2) {
      const jong = w => { const c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c % 28 !== 0; };
      const names = weak.length === 2 ? `‘${weak[0].label}’${jong(weak[0].label) ? "과" : "와"} ‘${weak[1].label}’` : `‘${weak[0].label}’`;
      $("dLead").textContent = `${names} 영역만 채우면 독해력이 한층 높아질 거예요.`;
      $("dTips").innerHTML = `<h4>이렇게 연습해 보세요</h4>` + weak.map(s => `<p class="tip"><b>${s.label}</b> · ${s.tip}</p>`).join("");
    } else {
      $("dLead").textContent = "지금은 글을 읽는 힘이 한창 자라는 중이에요.";
      $("dTips").innerHTML = `<h4>꾸준함이 가장 큰 힘이에요</h4>
        <p class="tip">독해력은 하루아침에 늘지 않지만, 매일 조금씩 읽는 만큼 반드시 자랍니다. 처음에는 짧은 글 한 편을 끝까지 천천히 읽는 것부터 시작해 보세요.</p>
        <p class="tip">읽은 내용을 가족에게 이야기해 보는 것만으로도 글을 이해하는 힘이 길러져요. 조급해하지 말고 즐겁게 꾸준히 노력해 보세요!</p>`;
    }
  }
  const hasBook = stage !== null;
  $("dClose").classList.toggle("hidden", !hasBook);
  $("dTips").classList.toggle("hidden", hasBook);
  $("recoCover").classList.toggle("hidden", !(hasBook && COVERS[stage]));
  if (hasBook) { $("recoCover").src = COVERS[stage] || ""; $("recoCover").alt = `용선생 최상위 독해 ${stage}단계 표지`; }
  $("buyBtn").classList.toggle("hidden", !(hasBook && BUY_URL[stage]));
  if (hasBook && BUY_URL[stage]) $("buyBtn").href = BUY_URL[stage];

  buildResult(correct, score, stats);
  theme(null);
  show("recoScreen");
}

/* ===== 자세한 결과 ===== */
function radarSVG(stats){
  const W = 520, H = 380, cx = 260, cy = 190, R = 118, N = stats.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const poly = r => stats.map((_, i) => pt(i, r).map(n => n.toFixed(1)).join(",")).join(" ");
  let g = "";
  [0.25, 0.5, 0.75].forEach(l => g += `<polygon points="${poly(R * l)}" fill="none" stroke="#e7e1d8"/>`);
  stats.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e7e1d8"/>`; });
  g += `<polygon points="${poly(R)}" fill="none" stroke="#7d756c" stroke-width="2.5" stroke-linejoin="round"/>`;
  const shape = stats.map((s, i) => pt(i, R * Math.max(s.got / s.n, 0.03)).map(n => n.toFixed(1)).join(",")).join(" ");
  g += `<polygon points="${shape}" fill="#7fa8e0" fill-opacity=".5" stroke="#4b84d4" stroke-width="2" stroke-linejoin="round"/>`;
  stats.forEach((s, i) => {
    const [x, y] = pt(i, R + 26);
    const anchor = Math.abs(x - cx) < 5 ? "middle" : (x > cx ? "start" : "end");
    const yy = y < cy - 5 ? y - 14 : (y > cy + 5 ? y + 6 : y - 4);
    g += `<text x="${x.toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anchor}" font-size="15" font-weight="700" fill="#2a2622">${s.label}</text>`;
    g += `<text x="${x.toFixed(1)}" y="${(yy + 18).toFixed(1)}" text-anchor="${anchor}" font-size="13" fill="#6f675f">${s.got} / ${s.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="영역별 독해력 그래프">${g}</svg>`;
}
const plain = h => h.replace(/<[^>]+>/g, "");
function buildResult(correct, score, stats){
  $("resGrade").textContent = `${grade}학년`;
  $("score").innerHTML = `${score}<small> / ${QUESTIONS.length}</small>`;
  $("areas").innerHTML = radarSVG(stats);
  $("bysets").innerHTML = SECTIONS.map((s, si) => {
    const [a, b] = RANGES[si]; let got = 0;
    for (let i = a - 1; i < b; i++) if (correct[i]) got++;
    return `<div class="area"><b>${s.stage} [${a}~${b}번]</b><span>${got} / ${b - a + 1}</span></div>`;
  }).join("");
  const txt = (q, k) => `${NUMS[k]} ${plain(q.choices[k])}`.trim();
  $("reviewList").innerHTML = SECTIONS.map((s, si) => {
    const [a, b] = RANGES[si];
    let h = `<div class="rset s${si}">${s.stage} [${a}~${b}번]</div>`;
    for (let i = a - 1; i < b; i++) {
      const q = QUESTIONS[i], ok = correct[i];
      h += `<div class="ritem"><div class="rq"><span class="badge ${ok ? "ok" : "ng"}">${ok ? "정답" : "오답"}</span>${String(i + 1).padStart(2, "0")}. ${q.q}</div>
        <div class="ra">정답: ${txt(q, q.answer)}${ok ? "" : `<br>내가 고른 답: ${txt(q, picks[i])}`}</div></div>`;
    }
    return h;
  }).join("");
  $("review").classList.add("hidden");
  $("showReview").classList.remove("hidden");
}
$("toResult").addEventListener("click", () => show("resultScreen"));
$("backReco").addEventListener("click", () => show("recoScreen"));
$("showReview").addEventListener("click", () => { $("review").classList.remove("hidden"); $("showReview").classList.add("hidden"); });
$("retry").addEventListener("click", () => {
  resetPicks(); grade = null; shownSide = null;
  document.querySelectorAll(".gbtn").forEach(x => x.setAttribute("aria-pressed", "false"));
  $("startBtn").disabled = true;
  theme(null); show("startScreen");
});
</script>
